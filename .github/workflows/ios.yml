name: ios-simulator
on:
  workflow_dispatch:
    inputs:
      url:
        default: https://opengym.runs-on.dev
jobs:
  sim:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device: ["iPhone 15 Pro", "iPhone SE (3rd generation)", "iPhone 16 Pro Max"]
    steps:
      - uses: actions/checkout@v4
      - run: pip3 install --break-system-packages selenium
      - run: python3 run.py "${{ matrix.device }}" "${{ inputs.url }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.device }}
          path: out/
