name: ios-simulator
on:
  workflow_dispatch:
    inputs:
      url:
        description: Leave empty for the demo build in app/
        default: ""
jobs:
  sim:
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        device: ["iPhone 15 Pro", "iPhone SE (3rd generation)", "iPhone 16 Pro Max"]
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: bash run.sh "${{ matrix.device }}" ${{ inputs.url }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.device }}
          path: out/
